services:
  - type: web
    name: eleicao2026
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: eleicao2026-cache
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: eleicao2026-history
          property: connectionString
  - type: keyvalue
    name: eleicao2026-cache
    plan: free
    ipAllowList: []
databases:
  - name: eleicao2026-history
    plan: free
    ipAllowList: []
